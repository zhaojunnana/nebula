########## basics ##########
--daemonize=true
--pid_file=pids/nebula-metad-1.pid

########## logging ##########
--log_dir=logs/meta1
--minloglevel=0
--v=0
--logbufsecs=0
--redirect_stdout=true
--stdout_log_file=metad-1-stdout.log
--stderr_log_file=metad-1-stderr.log
--stderrthreshold=3
--timestamp_in_logfile_name=true

########## networking ##########
# 三个 MetaD 节点的地址
# 注意：Raft 端口是 port+1，所以端口必须间隔至少 2，避免冲突
# metad-0: 9559 (Raft: 9560)
# metad-1: 9561 (Raft: 9562)
# metad-2: 9563 (Raft: 9564)
--meta_server_addrs=127.0.0.1:9559,127.0.0.1:9561,127.0.0.1:9563
--local_ip=127.0.0.1
--port=9561
--ws_ip=0.0.0.0
--ws_http_port=19560

########## storage ##########
--data_path=data/meta1

########## Misc #########
--default_parts_num=10
--default_replica_factor=3
--heartbeat_interval_secs=10
